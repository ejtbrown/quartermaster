review_scope:
  regions:
    - 'us-east-2 (accepted primary workload region)'
    - 'us-west-2 (approved alternative; proposed backup destination)'
    - 'us-east-1 (approved alternative and service-specific control-plane needs)'
  environments:
    - dev
    - production
  evidence:
    - 'Initial inspection on 2026-09-07 found design artifacts only; the subsequent authorized build added local application, SQL, Terraform, and CI foundations.'
    - 'Initial inspection found an unborn main branch. The reviewed foundation/delivery implementation was subsequently published as 173e88c on main and dev; current working branch is dev.'
    - 'The user specified AWS, Terraform, GitHub, dev-from-dev, and production-from-main as target constraints.'
    - 'DESIGN.md defines the target architecture; docs/IMPLEMENTATION.md and docs/DEPLOYMENT-2026-09-07.md distinguish the deployed Ohio data/governance subset from remaining application integrations.'
    - 'Erick Brown accepted Q-001 through Q-004 on 2026-09-06; see docs/decisions/0001-pilot-operating-model.md.'
    - 'Erick Brown accepted Q-005 through Q-009 on 2026-09-07; see docs/decisions/0002-regions-recovery-and-build-hosts.md.'
    - 'Erick Brown accepted Q-031/Q-032 on 2026-09-07: 24-hour recovery time and a separate production account after church acceptance; see docs/decisions/0003-recovery-time-and-production-account.md.'
    - 'Read-only default-profile STS authentication succeeded with configured region us-east-2; GitHub repository is PUBLIC.'
    - 'Read-only SSH checks succeeded for mac-dev (Xcode present) and linux-dev (Java/Node present); full mobile toolchain/signing readiness is not yet established.'
    - 'Ohio Nova 2 Lite US profile is ACTIVE and lists only us-east-2, us-east-1, and us-west-2 destinations.'
  assumptions:
    - 'Resource entries below describe the complete target; implementation_evidence identifies which subset is actually deployed. Proposed resources must not be treated as live inventory.'
    - "Production domain remains undecided; development/testing uses the default profile's account, with a separate production account created only after church acceptance."
