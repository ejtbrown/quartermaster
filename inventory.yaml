  - alias: 'mac-dev'
    lifecycle: existing
    role: 'optional device/browser testing; native iOS build/signing deferred, not a release dependency'
    evidence: 'SSH reached Darwin; Xcode 26.1.1; Node not on noninteractive SSH command path'
  - alias: 'linux-dev'
    lifecycle: existing
    role: 'optional device/browser testing; native Android build/testing deferred, not a release dependency'
    evidence: 'SSH reached Linux; Java 17 and Node; Android SDK tools not on command path'
  - alias: 'current development host'
    lifecycle: existing
    role: 'local development and reviewed infrastructure operations; native release coordinator deferred'
    evidence: 'No coordinator implemented or required under decision 0007'
