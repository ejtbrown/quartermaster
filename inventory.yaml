networking:
  - name: 'database_vpc'
    lifecycle: proposed
    resources:
      - 'VPC'
      - 'isolated subnets in at least two Availability Zones'
      - 'route tables'
      - 'database security group'
    hourly_charged_resources: []
    excluded_resources:
      - 'NAT gateway'
      - 'load balancer'
      - 'interface VPC endpoint'
      - 'public IPv4 address'
data_stores:
  - name: 'Aurora PostgreSQL'
    lifecycle: proposed
    role: 'relational system of record, full-text search, and reporting'
    scale_to_zero: 'yes in both environments; every instance has minimum 0 ACU and pauses after five idle minutes; retained bytes and secrets remain billable'
  - name: 'DynamoDB'
    lifecycle: proposed
    role: 'ephemeral conversation/web-session and response caches; durable drafts/commit facts remain relational'
    scale_to_zero: 'request throughput yes; retained bytes remain billable subject to allowances'
  - name: 'S3'
    lifecycle: proposed
    role: 'media originals/variants, exports, artifacts, and Terraform state'
    scale_to_zero: 'request throughput yes; retained bytes remain billable subject to plan credits'
observability:
  - name: 'CloudWatch'
    lifecycle: proposed
    resources:
      - 'structured log groups'
      - 'service metrics'
      - 'standard alarms'
      - 'dashboards'
  - name: 'CloudTrail'
    lifecycle: proposed
    resources:
      - 'control-plane audit trail'
always_on_candidates:
  - logical_name: 'Aurora retained storage and Secrets Manager credentials'
    estimated_monthly_usd: 2.80
    evidence: 'cost_model.md'
    note: 'durable data/credentials, not continuously running compute'
scale_to_zero_regressions_rejected:
  - 'nonzero Aurora minimum capacity'
  - 'provisioned Aurora instance'
  - 'RDS Proxy'
  - 'logical replication'
  - 'Aurora Global Database'
  - 'Aurora zero-ETL integration'
  - 'Babelfish'
  - 'synthetic database keepalive'
  - 'pg_cron or another in-database dependency for required scheduled work'
missing_context:
  - 'Church acceptance before production bootstrap; future production account ID, roles, and bootstrap resources (separate-account topology is accepted Q-032)'
  - 'Completed exact-commit CodeBuild/CodePipeline release and public HTTPS/origin-denial evidence'
  - 'User, asset, image, request, and AI-session volumes for the confirmed one-church pilot; future tenant growth'
  - 'Measured restore performance against accepted 24-hour RTO; backup economics and completion age for preferred 24-hour RPO'
  - 'Data-retention, residency, insurance, accounting, and privacy requirements'
  - 'Final production domain'
  - 'Existing GitHub organization controls and AWS account bootstrap resources'
  - 'Real iPhone Safari/Android Chrome capture tests and supported browser floor; native signing/store setup is deferred'
