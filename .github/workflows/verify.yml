name: Verify foundation

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Requires the separate, disposable, unprivileged CodeBuild runner project.
    # No local signing host or deployment role may match this label.
    runs-on: codebuild-quartermaster-dev-checks-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm infra:check
      - run: pnpm audit --audit-level high
